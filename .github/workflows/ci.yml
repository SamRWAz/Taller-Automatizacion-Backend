name: CI / CD Pipeline

on:
  push:
    branches: [ 'main', 'develop' ]
  pull_request:
    branches: [ 'main', 'develop' ]
  workflow_dispatch:
    inputs:
      testTag:
        description: 'Tag de Karate a evaluar individualmente (ej: @Issue-1) o deja "all" para evaluar todas una por una'
        required: false
        default: 'all'

permissions:
  contents: read
  issues: write

jobs:
  setup:
    name: Preparar Matriz de Pruebas
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Despertar backend de Render (Warm-up)
        run: |
          echo "Waking up Render backend from cold sleep..."
          curl -s --retry 5 --retry-delay 5 --retry-connrefused --max-time 60 "https://taller-de-tecnicas-de-prueba-de-caja.onrender.com/api/ejercicios" > /dev/null || true
          echo "Render backend is ready!"

      - name: Determinar pruebas a evaluar
        id: set-matrix
        run: |
          input_tag="${{ github.event.inputs.testTag }}"
          if [ -n "$input_tag" ] && [ "$input_tag" != "all" ]; then
            if [ "${input_tag#@}" = "$input_tag" ]; then
              input_tag="@$input_tag"
            fi
            echo "Ejecutando prueba individual: $input_tag"
            echo "matrix=[\"$input_tag\"]" >> $GITHUB_OUTPUT
          else
            echo "Ejecutando todas las pruebas individualmente por matriz..."
            echo 'matrix=["@Issue-1","@Issue-2","@Issue-3","@Issue-4","@Issue-5","@Issue-6","@Issue-7","@Issue-8","@Issue-9","@Issue-10","@Issue-11","@Issue-12","@Issue-13","@Issue-14","@Issue-15","@Issue-16"]' >> $GITHUB_OUTPUT
          fi

  test:
    name: "Prueba ${{ matrix.tag }}"
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        tag: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      JAVA_VERSION: '21'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk-${{ env.JAVA_VERSION }}-${{ hashFiles('**/build.gradle','**/settings.gradle','**/gradle.lockfile') }}
          restore-keys: |
            gradle-${{ runner.os }}-jdk-${{ env.JAVA_VERSION }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run test ${{ matrix.tag }}
        id: test_execution
        continue-on-error: true
        run: |
          tag='${{ matrix.tag }}'
          echo "Ejecutando individualmente el escenario con tag: '$tag'"
          ./gradlew clean test --no-daemon --console=plain --stacktrace -Dkarate.options="--tags $tag"

      - name: Upload Karate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-reports-${{ matrix.tag }}
          path: target/karate-reports
          retention-days: 7

      - name: Determine test status
        if: always()
        id: test_status
        run: |
          exit_code=${{ steps.test_execution.outcome }}
          if [ "$exit_code" = "success" ]; then
            echo "status=passed" >> $GITHUB_OUTPUT
            echo "TEST_RESULT=passed" >> $GITHUB_ENV
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "TEST_RESULT=failed" >> $GITHUB_ENV
          fi

      - name: Extract issue number from tag
        if: always()
        id: issue_info
        run: |
          tag="${{ matrix.tag }}"
          if [[ $tag =~ Issue-([0-9]+) ]]; then
            issue_number="${BASH_REMATCH[1]}"
            echo "issue_number=$issue_number" >> $GITHUB_OUTPUT
            echo "Found Issue #$issue_number from tag '$tag'"
          else
            echo "No Issue tag found in: '$tag'"
            echo "issue_number=" >> $GITHUB_OUTPUT
          fi

      - name: Update GitHub Issue with test results
        if: always() && steps.issue_info.outputs.issue_number != ''
        run: |
          ISSUE_NUMBER="${{ steps.issue_info.outputs.issue_number }}"
          TEST_STATUS="${{ steps.test_status.outputs.status }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPO="${{ github.repository }}"
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"

          echo "Updating Issue #$ISSUE_NUMBER with status: $TEST_STATUS"

          case "$TEST_STATUS" in
            "passed")
              STATUS_LABEL="status:passed"
              STATUS_EMOJI="✅"
              ;;
            "failed")
              STATUS_LABEL="status:failed"
              STATUS_EMOJI="❌"
              ;;
            *)
              STATUS_LABEL="status:unknown"
              STATUS_EMOJI="⚠️"
              ;;
          esac

          ISSUES_API="https://api.github.com/repos/$REPO/issues/$ISSUE_NUMBER"
          LABELS_API="$ISSUES_API/labels"

          echo "Fetching current labels from Issue #$ISSUE_NUMBER..."
          CURRENT_LABELS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$ISSUES_API" | jq -r '.labels[].name')

          for label in $CURRENT_LABELS; do
            if [[ $label == status:* ]]; then
              echo "  Removing label: $label"
              curl -s -X DELETE \
                -H "Authorization: token $GITHUB_TOKEN" \
                "$LABELS_API/$label" \
                -o /dev/null
            fi
          done

          echo "Adding new label: $STATUS_LABEL"
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            "$LABELS_API" \
            -d "[\"$STATUS_LABEL\"]" \
            -o /dev/null

          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          COMMENT_BODY="$STATUS_EMOJI **Test Execution Report** ($TIMESTAMP)

          - **Tag Evaluado**: \`${{ matrix.tag }}\`
          - **Status**: \`$TEST_STATUS\`
          - **Run**: [$RUN_URL]($RUN_URL)
          - **Timestamp**: $TIMESTAMP

          *Updated automatically by GitHub Actions Matrix*"

          echo "Adding comment to Issue #$ISSUE_NUMBER..."
          PAYLOAD=$(jq -n --arg b "$COMMENT_BODY" '{body: $b}')
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "$ISSUES_API/comments" \
            -d "$PAYLOAD" \
            -o /dev/null

          echo "✅ Issue #$ISSUE_NUMBER updated successfully!"

      - name: Fail workflow if test failed
        if: always() && env.TEST_RESULT == 'failed'
        run: |
          echo "❌ Test ${{ matrix.tag }} failed during execution!"
          exit 1
